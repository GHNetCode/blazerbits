name: Check GitHub Pages Certificate

on:
  schedule:
    # Run every day at 09:20 UTC
    - cron: '20 9 * * *'

  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email to verify Yahoo SMTP settings'
        required: true
        type: boolean
        default: false

jobs:
  check-certificate:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # TEST EMAIL
      # ------------------------------------------------------------
      - name: Send Test Email
        if: github.event_name == 'workflow_dispatch' && inputs.test_email == true
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.mail.yahoo.com
          server_port: 465
          secure: true
          username: ${{ secrets.YAHOO_EMAIL }}
          password: ${{ secrets.YAHOO_APP_PASSWORD }}
          subject: "TEST: Blazerbits SSL Certificate Monitor"
          to: ghnetcode2020@yahoo.com
          from: ghnetcode2020@yahoo.com
          body: |
            BLAZERBITS SSL CERTIFICATE MONITOR
            ========================================

            This is a TEST EMAIL.

            The GitHub Actions SSL certificate monitor
            successfully reached the Yahoo SMTP server.

            If you have received this email, the following
            configuration is working:

            Yahoo SMTP server:
            smtp.mail.yahoo.com

            Destination:
            ghnetcode2020@yahoo.com

            Repository:
            GHNetCode/blazerbits

            ========================================
            TEST COMPLETE

      # ------------------------------------------------------------
      # CERTIFICATE CHECK
      # ------------------------------------------------------------
      - name: Check GitHub Pages certificate
        if: github.event_name != 'workflow_dispatch' || inputs.test_email != true
        id: certificate_check
        shell: bash
        run: |
          set -e

          DOMAIN="blazerbits.uk"
          WARNING_DAYS=14
          WARNING_SECONDS=$((WARNING_DAYS * 24 * 60 * 60))

          IPS=(
            "185.199.108.153"
            "185.199.109.153"
            "185.199.110.153"
            "185.199.111.153"
          )

          FAILED=0
          EARLIEST_EXPIRY=0
          EARLIEST_EXPIRY_DATE=""
          EARLIEST_IP=""

          echo "========================================"
          echo "GitHub Pages Certificate Check"
          echo "Domain: $DOMAIN"
          echo "Warning threshold: $WARNING_DAYS days"
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================"
          echo

          for IP in "${IPS[@]}"; do
            echo "Checking $DOMAIN via $IP..."

            CERT_INFO=$(echo | openssl s_client \
              -connect "${IP}:443" \
              -servername "$DOMAIN" \
              2>/dev/null | openssl x509 -noout -enddate 2>/dev/null || true)

            if [ -z "$CERT_INFO" ]; then
              echo "::error::Unable to retrieve certificate from $IP"
              FAILED=1
              echo
              continue
            fi

            EXPIRY_RAW="${CERT_INFO#notAfter=}"

            EXPIRY_TIMESTAMP=$(date -d "$EXPIRY_RAW" +%s)
            NOW_TIMESTAMP=$(date +%s)

            SECONDS_REMAINING=$((EXPIRY_TIMESTAMP - NOW_TIMESTAMP))
            DAYS_REMAINING=$((SECONDS_REMAINING / 86400))

            EXPIRY_DATE=$(date -d "@$EXPIRY_TIMESTAMP" -u '+%A, %d %B %Y at %H:%M:%S UTC')

            echo "Certificate expires: $EXPIRY_DATE"
            echo "Days remaining: $DAYS_REMAINING"
            echo

            if [ "$EARLIEST_EXPIRY" -eq 0 ] || [ "$EXPIRY_TIMESTAMP" -lt "$EARLIEST_EXPIRY" ]; then
              EARLIEST_EXPIRY="$EXPIRY_TIMESTAMP"
              EARLIEST_EXPIRY_DATE="$EXPIRY_DATE"
              EARLIEST_IP="$IP"
            fi

            if [ "$SECONDS_REMAINING" -le 0 ]; then
              echo "::error::Certificate has EXPIRED!"
              FAILED=1

            elif [ "$SECONDS_REMAINING" -le "$WARNING_SECONDS" ]; then
              echo "::error::Certificate expires within $WARNING_DAYS days!"
              FAILED=1

            else
              echo "✓ Certificate has more than $WARNING_DAYS days remaining."
            fi

            echo "----------------------------------------"
          done

          echo
          echo "========================================"
          echo "Summary"
          echo "========================================"

          if [ "$EARLIEST_EXPIRY" -ne 0 ]; then

            NOW_TIMESTAMP=$(date +%s)
            TOTAL_SECONDS=$((EARLIEST_EXPIRY - NOW_TIMESTAMP))
            TOTAL_DAYS=$((TOTAL_SECONDS / 86400))

            echo "Earliest certificate expiry:"
            echo "$EARLIEST_EXPIRY_DATE"
            echo "Days remaining: $TOTAL_DAYS"
            echo "GitHub IP: $EARLIEST_IP"
            echo

            {
              echo "EXPIRY_DATE=$EARLIEST_EXPIRY_DATE"
              echo "DAYS_REMAINING=$TOTAL_DAYS"
              echo "GITHUB_IP=$EARLIEST_IP"
              echo "CHECK_DATE=$(date -u '+%A, %d %B %Y at %H:%M:%S UTC')"
            } >> "$GITHUB_ENV"

            if [ "$TOTAL_SECONDS" -le 0 ]; then

              echo "ALERT_REQUIRED=true" >> "$GITHUB_ENV"

              echo "::error::ACTION REQUIRED: GitHub Pages certificate has EXPIRED."
              exit 1

            elif [ "$TOTAL_SECONDS" -le "$WARNING_SECONDS" ]; then

              echo "ALERT_REQUIRED=true" >> "$GITHUB_ENV"

              echo "::error::ACTION REQUIRED: GitHub Pages certificate expires in $TOTAL_DAYS days."
              echo "::error::Expiry date: $EARLIEST_EXPIRY_DATE"
              echo "::error::GitHub IP: $EARLIEST_IP"

              exit 1

            else

              echo "ALERT_REQUIRED=false" >> "$GITHUB_ENV"

              echo "✓ Certificate is healthy."
              echo "✓ $TOTAL_DAYS days remaining."

            fi

          else

            echo "ALERT_REQUIRED=true" >> "$GITHUB_ENV"
            echo "EXPIRY_DATE=Unable to determine" >> "$GITHUB_ENV"
            echo "DAYS_REMAINING=Unknown" >> "$GITHUB_ENV"
            echo "GITHUB_IP=Unable to determine" >> "$GITHUB_ENV"
            echo "CHECK_DATE=$(date -u '+%A, %d %B %Y at %H:%M:%S UTC')" >> "$GITHUB_ENV"

            echo "::error::Could not retrieve a certificate from any GitHub Pages IP."

            exit 1

          fi

      # ------------------------------------------------------------
      # WARNING EMAIL
      # ------------------------------------------------------------
      - name: Send SSL warning email
        if: always() && env.ALERT_REQUIRED == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.mail.yahoo.com
          server_port: 465
          secure: true
          username: ${{ secrets.YAHOO_EMAIL }}
          password: ${{ secrets.YAHOO_APP_PASSWORD }}
          subject: "ACTION REQUIRED: Blazerbits SSL certificate needs attention"
          to: ghnetcode2020@yahoo.com
          from: ghnetcode2020@yahoo.com
          body: |
            BLAZERBITS SSL CERTIFICATE ALERT
            ========================================

            Certificate provisioning/renewal appears to
            require attention.

            Certificate status
            ----------------------------------------
            Domain: blazerbits.uk
            Certificate expiry: ${{ env.EXPIRY_DATE }}
            Days remaining: ${{ env.DAYS_REMAINING }}
            GitHub IP: ${{ env.GITHUB_IP }}
            Certificate check: ${{ env.CHECK_DATE }}

            ACTION REQUIRED
            ========================================

            1. CLOUDFLARE

            In Cloudflare, change the following records
            from PROXIED to DNS-ONLY:

            A    185.199.108.153
            A    185.199.109.153
            A    185.199.110.153
            A    185.199.111.153
            www  CNAME  ghnetcode.github.io

            ----------------------------------------

            2. GITHUB

            Go to:

            GitHub
            -> Settings
            -> Pages
            -> Custom domain

            Delete:

            blazerbits.uk

            Then add:

            blazerbits.uk

            again.

            Wait for the custom-domain check to go GREEN.

            Then enable:

            Enforce HTTPS

            Check that the website is reachable:

            https://blazerbits.uk

            ----------------------------------------

            3. CLOUDFLARE

            Go back to:

            Cloudflare
            -> Domains
            -> Overview
            -> DNS Records

            Change the five records listed above
            back to PROXIED.

            ----------------------------------------

            This SSL certificate monitor will continue
            checking the GitHub Pages certificate daily.

            Repository:
            GHNetCode/blazerbits

            ========================================
            END OF ALERT

      # ------------------------------------------------------------
      # FAIL THE JOB IF CERTIFICATE NEEDS ATTENTION
      # ------------------------------------------------------------
      - name: Fail workflow if certificate needs attention
        if: env.ALERT_REQUIRED == 'true'
        shell: bash
        run: |
          echo "Certificate requires attention."
          exit 1
